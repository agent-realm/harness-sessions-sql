# The conformance kit and the examples, against a disposable ClickHouse and PostgreSQL pair, on
# every pull request and every push to main (AGENTS.md, Testing).
#
# GitHub-hosted runner only, and no secrets. Each job generates its own database password, masks
# it, and starts its own two containers on 127.0.0.1, so nothing outside the runner reaches them.
# Never `pull_request_target`: a fork's code runs with this repository's read-only token only.
# Any time a step prints is indicative: a shared runner, not a house of realistic size.
name: conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exact versions, by digest.
  CH_IMAGE: clickhouse/clickhouse-server:26.8.36@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
  PG_IMAGE: postgres:16.15@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
  # The harness-session-adapters package the kit and the examples read (SSQL_ADAPTERS), at the
  # harness-skeleton commit of the version the examples' expected output names (1.1.0).
  ADAPTERS_REPO: agent-realm/harness-skeleton
  ADAPTERS_REF: e1e590068f73e4aa612e342c435cc9a16d7ff427

jobs:
  kit:
    name: kit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.ADAPTERS_REPO }}
          ref: ${{ env.ADAPTERS_REF }}
          path: adapters-checkout
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Start a disposable ClickHouse and PostgreSQL
        run: bash scripts/ci-databases.sh
      - name: Install the kit's one dependency
        working-directory: conformance
        run: npm ci --ignore-scripts
      - name: The kit's own tests
        working-directory: conformance
        run: npm test
      - name: Every check, on both database profiles
        working-directory: conformance
        run: node run.mjs
      - name: The self-test, every check against its faults
        working-directory: conformance
        run: node run.mjs --self-test
      - name: Remove the containers
        if: always()
        run: docker rm -f -v ssql-ch ssql-pg || true

  examples:
    name: examples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.ADAPTERS_REPO }}
          ref: ${{ env.ADAPTERS_REF }}
          path: adapters-checkout
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Start a disposable ClickHouse and PostgreSQL
        run: bash scripts/ci-databases.sh
      - name: Install the kit's one dependency (the examples import the kit's code)
        working-directory: conformance
        run: npm ci --ignore-scripts
      - name: Every example, on both database profiles, against its README's expected output
        working-directory: examples
        run: node test.mjs
      - name: On failure, each example's whole output, to compare with its README
        if: failure()
        working-directory: examples
        run: |
          for d in [0-9][0-9]-*/; do
            for p in clickhouse postgres; do
              echo "::group::${d%/} --profile $p"
              node "${d}example.mjs" --profile "$p" || true
              echo "::endgroup::"
            done
          done
      - name: Remove the containers
        if: always()
        run: docker rm -f -v ssql-ch ssql-pg || true
