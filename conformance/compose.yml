# A disposable ClickHouse and PostgreSQL pair for the conformance kit, on this machine only.
#
# Never point the kit at a database that holds data you want to keep: every run creates and drops
# namespaces of its own (ClickHouse databases, PostgreSQL schemas).
#
# Safe by default:
# - both ports are published on 127.0.0.1 only. A port Docker publishes bypasses the host's
#   firewall, and the user `kit` is a PostgreSQL superuser (one that can run programs inside the
#   container), so neither server is reachable from another machine unless you say so;
# - there is no default password: without SSQL_KIT_PASSWORD the file refuses to start.
#
#   SSQL_KIT_PASSWORD  the password of the user `kit` in both servers (required)
#   SSQL_KIT_CH_PORT   the local port of ClickHouse HTTP (default 8123)
#   SSQL_KIT_PG_PORT   the local port of PostgreSQL (default 5432)
#
# To publish the pair any other way (on every interface, under another port scheme, with a
# password your deploy tool supplies), write a deployment file of your own, outside this
# repository (conformance/README.md says how), rather than editing this one.
#
# Then, for example:
#   SSQL_KIT_PASSWORD=… docker compose up -d
#   SSQL_CH_URL=http://localhost:8123 SSQL_CH_USER=kit SSQL_CH_PASSWORD=… \
#   SSQL_PG_URL=postgres://kit:…@localhost:5432/kit \
#   node run.mjs
services:
  clickhouse:
    image: ${CH_IMAGE:-clickhouse/clickhouse-server:26.8}
    environment:
      CLICKHOUSE_USER: kit
      CLICKHOUSE_PASSWORD: ${SSQL_KIT_PASSWORD:?set SSQL_KIT_PASSWORD, a password of your own}
    ports:
      - "127.0.0.1:${SSQL_KIT_CH_PORT:-8123}:8123"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  postgres:
    image: ${PG_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: kit
      POSTGRES_PASSWORD: ${SSQL_KIT_PASSWORD:?set SSQL_KIT_PASSWORD, a password of your own}
      POSTGRES_DB: kit
    ports:
      - "127.0.0.1:${SSQL_KIT_PG_PORT:-5432}:5432"
