# A disposable ClickHouse and PostgreSQL pair for the conformance kit.
#
# The credentials below are throwaway values for a test deployment that is created for one
# run and torn down after it. Never reuse them, and never point the kit at a database that
# holds data you want to keep: every run creates and drops its own databases.
#
# Ports are taken from the environment, so a deployment tool can place the pair anywhere:
#   CH_HTTP_PORT (default 8123)   ClickHouse HTTP
#   PG_PORT      (default 5432)   PostgreSQL
# A test-deploy tool that hands out a block of ports as PORT_BASE, PORT_BASE_1, ... can map
# them instead (see the comments on each `ports:` entry).
#
# Then, for example:
#   SSQL_CH_URL=http://localhost:8123 SSQL_CH_USER=kit SSQL_CH_PASSWORD=kit-throwaway \
#   SSQL_PG_URL=postgres://kit:kit-throwaway@localhost:5432/kit \
#   node run.mjs
services:
  clickhouse:
    image: ${CH_IMAGE:-clickhouse/clickhouse-server:26.8}
    environment:
      CLICKHOUSE_USER: kit
      CLICKHOUSE_PASSWORD: kit-throwaway
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${PORT_BASE:-${CH_HTTP_PORT:-8123}}:8123"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  postgres:
    image: ${PG_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: kit
      POSTGRES_PASSWORD: kit-throwaway
      POSTGRES_DB: kit
    ports:
      - "${PORT_BASE_1:-${PG_PORT:-5432}}:5432"
